<!doctype html>
<!-- 近似的 Kaggle 编辑器 DOM 夹具（APPROXIMATE）：真实 Kaggle 需要登录，无法直接测试。
     这里按公开资料模拟：每个单元格有 CodeMirror 6 风格的 .cm-editor/.cm-content（contenteditable），
     单元格内有 aria-label="Run current cell" 的按钮，页面上有“+ Code”按钮，报错输出含 Traceback。
     “运行”是假的：只识别 print("...") 和 1/0。 -->
<html><head><meta charset="utf-8"><title>Kaggle fixture (approximate)</title>
<style>body{font:14px sans-serif;margin:20px}.cell{border:1px solid #ccc;margin:8px 0;padding:6px}
.cm-content{min-height:20px;font-family:monospace;white-space:pre;outline:none;background:#fafafa}
.output{font-family:monospace;white-space:pre;color:#333}.stderr{color:#b00}</style></head>
<body>
<script>window.__nbacForceKaggle = true;</script>
<h3>Kaggle editor fixture (approximate)</h3>
<div id="cells"></div>
<div><button id="addCode">+ Code</button> <button>+ Markdown</button></div>
<script>
function fakeRun(cell){
  const code = cell.querySelector('.cm-content').innerText;
  const out = cell.querySelector('.output');
  out.className = 'output';
  if (/1\s*\/\s*0/.test(code)) {
    out.classList.add('stderr');
    out.textContent = 'Traceback (most recent call last):\n  File "<cell>", line 1\nZeroDivisionError: division by zero';
    return;
  }
  const m = [...code.matchAll(/print\("([^"]*)"/g)].map(x => x[1]);
  out.textContent = m.join('\n');
}
function addCell(code, after){
  const cell = document.createElement('div');
  cell.className = 'cell code-cell';
  cell.innerHTML = '<button aria-label="Run current cell">▶</button><div class="cm-editor"><div class="cm-content" contenteditable="true"></div></div><div class="output"></div>';
  cell.querySelector('.cm-content').textContent = code || '';
  cell.querySelector('button').onclick = () => fakeRun(cell);
  cell.querySelector('.cm-content').addEventListener('keydown', e => { if (e.key === 'Enter' && e.shiftKey) { e.preventDefault(); fakeRun(cell); } });
  const box = document.getElementById('cells');
  if (after && after.nextSibling) box.insertBefore(cell, after.nextSibling); else box.appendChild(cell);
  return cell;
}
addCell('print("hello")');
const bad = addCell('y = 1/0');
document.getElementById('addCode').onclick = () => addCell('');
fakeRun(bad);
</script>
</body></html>
