<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notebook AI 助手 · 设置</title>
  <link rel="stylesheet" href="../sidepanel/panel.css" />
  <style>
    body {
      display: block;
      height: auto;
      min-height: 100%;
      background: var(--sheet);
      padding: 28px 18px 48px;
    }
    .page { max-width: 920px; margin: 0 auto; }

    .hero {
      background: var(--paper);
      border: 1.5px solid var(--ink);
      border-left: 5px solid var(--ink);
      border-radius: 0;
      padding: 18px 20px;
      box-shadow: var(--shadow-md);
      margin-bottom: 16px;
    }
    .hero-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .hero h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--ink);
    }
    .hero h2::before {
      content: "";
      width: 3px;
      height: 18px;
      background: var(--ink);
      flex: none;
    }
    .privacy-badge {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--ink);
      border-radius: 0;
      padding: 3px 10px;
    }
    .hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; line-height: 1.55; }
    .hint code {
      font: 11.5px var(--mono);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 0;
      padding: 1px 5px;
      color: var(--ink);
    }
    .hint a { color: var(--ink); text-decoration: underline; font-weight: 600; }

    .global-card {
      background: var(--paper);
      border: 1.5px solid var(--ink);
      border-radius: 0;
      padding: 14px 18px 16px;
      box-shadow: var(--shadow-sm);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 6px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }
    .card {
      background: var(--paper);
      border: 1.5px solid var(--ink);
      border-radius: 0;
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
    }
    .card.active-card {
      box-shadow: var(--shadow-md);
    }
    .card h3 {
      margin: -16px -18px 12px;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
      background: #fafafa;
      border-bottom: 1px solid var(--line-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .card.active-card h3 {
      background: var(--ink);
      color: var(--paper);
      border-bottom-color: var(--ink);
    }
    .card-badges { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 5px; }
    .card label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-2);
      margin: 11px 0 5px;
    }
    .card label a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 0;
      padding: 1px 7px;
      font-size: 11px;
    }
    .card label a:hover { background: var(--ink); border-color: var(--ink); color: var(--paper); }

    input, select {
      width: 100%;
      border: 1px solid #a3a3a3;
      border-radius: 0;
      padding: 8px 10px;
      font: 13px var(--font);
      color: var(--ink);
      background: var(--paper);
      outline: none;
      transition: border-color 120ms ease-out, box-shadow 120ms ease-out;
    }
    input[data-f="model"], input[data-f="apiKey"] { font-family: var(--mono); font-size: 12px; }
    input[data-f="baseUrl"] { font-family: var(--mono); font-size: 11.5px; padding: 8px 9px; }
    input:focus, select:focus {
      border-color: var(--ink);
      box-shadow: var(--shadow-sm);
    }

    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-wrap input { padding-right: 40px; }
    .toggle-eye {
      position: absolute;
      right: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-2);
      width: 28px;
      height: 28px;
      border-radius: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-eye:hover { background: var(--surface); border-color: var(--ink); color: var(--ink); }
    .toggle-eye svg { width: 17px; height: 17px; }

    .sug-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .sug-chip {
      border: 1px solid var(--line);
      background: #fafafa;
      color: var(--ink-2);
      border-radius: 0;
      padding: 3px 9px;
      font: 11.5px var(--mono);
      font-weight: 500;
    }
    .sug-chip:hover { border-color: var(--ink); background: var(--surface); color: var(--ink); }
    .sug-chip.active { background: var(--ink); border-color: var(--ink); color: var(--paper); font-weight: 600; }
    .sug-chip:active { transform: translate(1px, 1px); }

    .tag {
      font-size: 10.5px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 0;
      padding: 2px 7px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .tag.key-status {
      color: var(--subtle);
      background: transparent;
      border: 1px dashed #a3a3a3;
      font-weight: 500;
    }
    .tag.key-status.configured {
      color: var(--ink);
      background: #eaeaea;
      border: 1px solid var(--ink);
      font-weight: 700;
    }
    .tag.key-status.configured::before {
      content: "";
      width: 5px;
      height: 5px;
      background: currentColor;
      flex: none;
    }
    .card.active-card .tag {
      color: #d4d4d4;
      background: transparent;
      border-color: #525252;
    }
    .card.active-card .tag.key-status {
      color: #a3a3a3;
      border: 1px dashed #737373;
    }
    .card.active-card .tag.key-status.configured {
      color: var(--paper);
      background: transparent;
      border: 1px solid #d4d4d4;
      font-weight: 700;
    }
    .card.active-card .tag.default-tag {
      color: var(--ink);
      background: var(--paper);
      border-color: var(--paper);
      font-weight: 700;
    }

    .action-bar {
      background: var(--paper);
      border: 1.5px solid var(--ink);
      border-radius: 0;
      padding: 12px 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .action-left { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .action-right { display: flex; align-items: center; margin-left: auto; }
    .btn {
      border: 1.5px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      border-radius: 0;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      min-height: 36px;
    }
    .btn:hover { background: var(--surface); }
    .btn:active { transform: translate(1px, 1px); box-shadow: none !important; }
    .btn.primary {
      background: var(--ink);
      color: var(--paper);
      box-shadow: 2px 2px 0 #a3a3a3;
    }
    .btn.primary:hover { background: var(--ink-2); }
    .btn.danger {
      border-left: 4px solid var(--ink);
      padding-left: 14px;
      background: repeating-linear-gradient(-45deg, #e2e2e2 0 3px, #ffffff 3px 6px);
      color: var(--ink);
      font-weight: 700;
    }
    .btn.danger:hover {
      background: var(--ink);
      color: var(--paper);
    }

    #message { font-size: 13px; font-weight: 600; color: var(--ink); }
    #message:not(:empty) {
      padding: 5px 12px;
      border-radius: 0;
      background: var(--surface);
      border: 1px solid var(--ink);
      border-left: 4px solid var(--ink);
    }
    #message.err { font-weight: 700; }
    #message.err:not(:empty) {
      background: repeating-linear-gradient(-45deg, #f3f3f3 0 4px, #ffffff 4px 8px);
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="hero-head">
        <h2>Notebook AI 助手 · 设置</h2>
        <span class="privacy-badge">本地存储 · 不同步云端</span>
      </div>
      <p class="hint">每个服务商的 API Key 都只保存在本机 Chrome 的 <code>chrome.storage.local</code>，不会同步、不会写进日志，只发给对应的接口。服务商、模型和思考强度可以在侧边栏底部直接切换。</p>
    </section>

    <section class="global-card">
      <div class="field">
        <label for="active">默认服务商</label>
        <select id="active"></select>
      </div>
      <div class="field">
        <label for="temperature">温度（0–1，越低越稳定；开启思考时部分模型会忽略）</label>
        <input id="temperature" type="number" min="0" max="1" step="0.1" />
      </div>
    </section>

    <section id="cards" class="cards-grid"></section>

    <footer class="action-bar">
      <div class="action-left">
        <button type="button" class="btn primary" id="save">保存</button>
        <div id="message" role="status" aria-live="polite"></div>
      </div>
      <div class="action-right">
        <button type="button" class="btn danger" id="clearKeys">清除所有 Key</button>
      </div>
    </footer>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
