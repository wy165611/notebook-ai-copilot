<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notebook AI 助手 · 设置</title>
  <link rel="stylesheet" href="../sidepanel/panel.css" />
  <style>
    body {
      display: block;
      height: auto;
      min-height: 100%;
      background-color: var(--sheet);
      background-image: radial-gradient(rgba(10, 10, 10, 0.16) 0.85px, transparent 0.85px);
      background-size: 6px 6px;
      padding: 28px 18px 48px;
    }
    .page { max-width: 860px; margin: 0 auto; }

    .hero {
      position: relative;
      background-color: var(--paper);
      background-image:
        radial-gradient(ellipse 68% 66% at 50% 50%, rgba(255, 255, 255, 0.98) 54%, rgba(255, 255, 255, 0.8) 78%, rgba(255, 255, 255, 0) 100%),

.9,-37.8%20740.1,-32.9%27%20fill=%27%230a0a0a%27/%3E%3Cpolygon%20points=%27635.2,39.4%20783.1,-16.4%20792.7,-12.0%27%20fill=%27%230a0a0a%27/%3E%3Cpolygon%20points=%27663.6,51.0%20806.5,-5.1%20815.0,-0.4%27%20fill=%27%230a0a0a%27/%3E%3Cpolygon%20points=%27703.3,55.9%20844.0,19.2%20851.6,25.8%27%20fill=%27%230a0a0a%27/%3E%3Cpolygon%20points=%27661.3,65.0%20858.7,32.9%20863.3,38.1%27%20fill=%27%230a0a0a%27/%3E%3Cpolygon%20points=%27687.4,73.1%20876.4,60.4%20878.1,65.8%27%20fill=%27%230a0a0a%27/%3E%3Ccircle%20cx=%2724%27%20cy=%2722%27%20r=%273.2%27%20fill=%27%230a0a0a%27%20opacity=%270.85%27/%3E%3Ccircle%20cx=%2748%27%20cy=%2742%27%20r=%271.8%27%20fill=%27%230a0a0a%27%20opacity=%270.85%27/%3E%3Ccircle%20cx=%2718%27%20cy=%27125%27%20r=%272.8%27%20fill=%27%230a0a0a%27%20opacity=%270.85%27/%3E%3Ccircle%20cx=%2758%27%20cy=%27140%27%20r=%272.0%27%20fill=%27%230a0a0a%27%20opacity=%270.85%27/%3E%3Ccircle%20cx=%27772%27%20cy=%2724%27%20r=%273.4%27%20fill=%27%230a0a0a%27%20opacity=%270.85%27/%3E%3Ccircle%20cx=%27748%27%20cy=%2744%27%20r=%271.9%27%20fill=%27%230a0a0a%27%20opacity=%270.85%27/%3E%3Ccircle%20cx=%27780%27%20cy=%27128%27%20r=%273.0%27%20fill=%27%230a0a0a%27%20opacity=%270.85%27/%3E%3Ccircle%20cx=%27740%27%20cy=%27142%27%20r=%272.2%27%20fill=%27%230a0a0a%27%20opacity=%270.85%27/%3E%3Ccircle%20cx=%27135%27%20cy=%2716%27%20r=%272.1%27%20fill=%27%230a0a0a%27%20opacity=%270.85%27/%3E%3Ccircle%20cx=%27665%27%20cy=%2718%27%20r=%272.2%27%20fill=%27%230a0a0a%27%20opacity=%270.85%27/%3E%3Ccircle%20cx=%27160%27%20cy=%27146%27%20r=%272.0%27%20fill=%27%230a0a0a%27%20opacity=%270.85%27/%3E%3Ccircle%20cx=%27630%27%20cy=%27145%27%20r=%272.1%27%20fill=%27%230a0a0a%27%20opacity=%270.85%27/%3E%3C/svg%3E");
      background-size: 100% 100%;
      border: 3px solid var(--ink);
      border-radius: 0;
      padding: 20px 24px;
      box-shadow: 6px 6px 0 var(--ink);
      margin-bottom: 18px;
    }
    .hero-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .hero h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
    }
    .hero h2::before {
      content: "";
      width: 11px;
      height: 20px;
      transform: skewX(-16deg);
      background: linear-gradient(135deg, var(--crimson) 0 50%, var(--ink) 50% 100%);
      border: 1.5px solid var(--ink);
      flex: none;
    }
    .privacy-badge {
      font-size: 12px;
      font-weight: 800;
      color: var(--paper);
      background: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 0;
      transform: skewX(-8deg);
      padding: 3px 12px;
      box-shadow: 3px 3px 0 var(--crimson);
    }
    .hint { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin: 8px 0 0; line-height: 1.55; }
    .hero .hint { color: var(--ink); }
    .hint code {
      font: 11.5px var(--mono);
      font-weight: 800;
      background: var(--tone-soft);
      border: 1.5px solid var(--ink);
      border-radius: 0;
      padding: 1px 5px;
      color: var(--ink);
    }
    .hint a { color: var(--ink); text-decoration: underline; font-weight: 800; }

    .global-card {
      background: var(--paper);
      border: 2.5px solid var(--ink);
      border-radius: 0;
      padding: 15px 18px 17px;
      box-shadow: var(--shadow-ink-lg);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 900;
      color: var(--ink);
      margin: 0 0 6px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }
    .card {
      background: var(--paper);
      border: 2.5px solid var(--ink);
      border-radius: 0;
      padding: 16px 18px;
      box-shadow: var(--shadow-ink-lg);
      transition: transform 110ms ease-out, box-shadow 110ms ease-out;
    }
    .card.active-card {
      border: 3px solid var(--ink);
      box-shadow: 6px 6px 0 var(--crimson);
    }
    .card h3 {
      margin: -16px -18px 12px;
      padding: 11px 18px;
      font-size: 15.5px;
      font-weight: 900;
      color: var(--ink);
      background-color: var(--tone-soft);
      background-image: radial-gradient(rgba(10, 10, 10, 0.12) 0.8px, transparent 0.8px);
      background-size: 5px 5px;
      border-bottom: 2px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card.active-card h3 {
      background-color: var(--ink);
      background-image: none;
      color: var(--paper);
    }
    .card-badges { display: inline-flex; align-items: center; gap: 6px; }
    .card label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 800;
      color: var(--ink-2);
      margin: 11px 0 5px;
    }
    .card label a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 800;
      background: var(--tone-soft);
      border: 1.5px solid var(--ink);
      border-radius: 0;
      padding: 1px 7px;
      font-size: 11px;
      box-shadow: 1.5px 1.5px 0 var(--ink);
    }
    .card label a:hover { background: var(--ink); color: var(--paper); }

    input, select {
      width: 100%;
      border: 2px solid var(--ink);
      border-radius: 0;
      padding: 8px 11px;
      font: 13px var(--font);
      font-weight: 700;
      color: var(--ink);
      background: #fafafa;
      outline: none;
      transition: box-shadow 110ms ease-out, background-color 110ms ease-out;
    }
    input[data-f="baseUrl"], input[data-f="model"], input[data-f="apiKey"] { font-family: var(--mono); font-size: 12.5px; }
    input:focus, select:focus {
      background: var(--paper);
      box-shadow: 3px 3px 0 var(--crimson);
    }

    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-wrap input { padding-right: 40px; }
    .toggle-eye {
      position: absolute;
      right: 6px;
      border: 1.5px solid transparent;
      background: transparent;
      color: var(--ink);
      width: 28px;
      height: 28px;
      border-radius: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-eye:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .toggle-eye svg { width: 17px; height: 17px; }

    .sug-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
    .sug-chip {
      border: 1.5px solid var(--ink);
      background: var(--tone-soft);
      color: var(--ink);
      border-radius: 0;
      padding: 4px 10px;
      font: 11.5px var(--mono);
      font-weight: 700;
      box-shadow: var(--shadow-ink-sm);
    }
    .sug-chip:hover { background: var(--ink); color: var(--paper); transform: translate(-1px, -1px); box-shadow: var(--shadow-ink); }
    .sug-chip.active { background: var(--ink); color: var(--paper); font-weight: 800; box-shadow: 2px 2px 0 var(--crimson); }
    .sug-chip:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink) !important; }

    .tag {
      font-size: 11px;
      color: var(--paper);
      background: var(--crimson);
      border: 1.5px solid var(--ink);
      border-radius: 0;
      transform: skewX(-8deg);
      padding: 2px 8px;
      font-weight: 800;
    }
    .tag.default-tag {
      color: var(--ink);
      background: var(--paper);
      border-color: var(--ink);
    }

    .action-bar {
      background: var(--paper);
      border: 2.5px solid var(--ink);
      border-radius: 0;
      padding: 13px 18px;
      box-shadow: var(--shadow-ink-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btns { display: flex; gap: 10px; align-items: center; }
    .btn {
      border: 2px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      border-radius: 0;
      padding: 8px 20px;
      font-size: 13.5px;
      font-weight: 800;
      min-height: 38px;
      box-shadow: var(--shadow-ink);
    }
    .btn:hover { background: var(--ink); color: var(--paper); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--crimson); }
    .btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink) !important; }
    .btn.primary {
      background: var(--ink);
      color: var(--paper);
      box-shadow: 3px 3px 0 #737373;
    }
    .btn.primary:hover { background: var(--ink); box-shadow: 4px 4px 0 var(--crimson); }
    .btn.danger {
      border-color: var(--crimson);
      color: var(--crimson-dark);
      background: var(--paper);
    }
    .btn.danger:hover {
      background: var(--crimson);
      border-color: var(--ink);
      color: var(--paper);
      box-shadow: var(--shadow-ink-md);
    }

    #message { font-size: 13px; font-weight: 800; color: var(--ink); }
    #message:not(:empty) {
      padding: 6px 14px;
      border-radius: 0;
      background: var(--ink);
      color: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0 var(--crimson);
    }
    #message.err { color: var(--crimson-dark); }
    #message.err:not(:empty) {
      background: var(--crimson-soft);
      color: var(--crimson-dark);
      box-shadow: var(--shadow-ink-sm);
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="hero-head">
        <h2>Notebook AI 助手 · 设置</h2>
        <span class="privacy-badge">本地存储 · 不同步云端</span>
      </div>
      <p class="hint">每个服务商的 API Key 都只保存在本机 Chrome 的 <code>chrome.storage.local</code>，不会同步、不会写进日志，只发给对应的接口。服务商、模型和思考强度可以在侧边栏底部直接切换。</p>
    </section>

    <section class="global-card">
      <div class="field">
        <label for="active">默认服务商</label>
        <select id="active"></select>
      </div>
      <div class="field">
        <label for="temperature">温度（0–1，越低越稳定；开启思考时部分模型会忽略）</label>
        <input id="temperature" type="number" min="0" max="1" step="0.1" />
      </div>
    </section>

    <section id="cards" class="cards-grid"></section>

    <footer class="action-bar">
      <div class="btns">
        <button type="button" class="btn primary" id="save">保存</button>
        <button type="button" class="btn danger" id="clearKeys">清除所有 Key</button>
      </div>
      <div id="message" role="status" aria-live="polite"></div>
    </footer>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
