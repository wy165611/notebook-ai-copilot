<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notebook AI 助手 · 设置</title>
  <link rel="stylesheet" href="../sidepanel/panel.css" />
  <style>
    body {
      display: block;
      height: auto;
      min-height: 100%;
      background-color: var(--paper);
      background-image: radial-gradient(rgba(24, 24, 27, 0.11) 1.1px, transparent 1.1px);
      background-size: 14px 14px;
      padding: 28px 18px 48px;
    }
    .page { max-width: 860px; margin: 0 auto; }

    .hero {
      background-color: var(--yellow);
      background-image: radial-gradient(rgba(24, 24, 27, 0.08) 1px, transparent 1px);
      background-size: 10px 10px;
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: var(--shadow-ink-lg);
      margin-bottom: 18px;
    }
    .hero-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .hero h2 {
      margin: 0;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 0.01em;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
    }
    .hero h2::before {
      content: "";
      width: 13px;
      height: 13px;
      border-radius: 4px;
      transform: rotate(-10deg);
      background: var(--blue);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      flex: none;
    }
    .privacy-badge {
      font-size: 12px;
      font-weight: 800;
      color: var(--green);
      background: var(--green-soft);
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 3px 12px;
      box-shadow: var(--shadow-ink-sm);
    }
    .hint { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin: 8px 0 0; line-height: 1.55; }
    .hero .hint { color: var(--ink); }
    .hint code {
      font: 11.5px var(--mono);
      font-weight: 700;
      background: var(--card);
      border: 1.5px solid var(--ink);
      border-radius: 5px;
      padding: 1px 5px;
      color: var(--ink);
    }
    .hint a { color: var(--blue); text-decoration: none; font-weight: 700; }
    .hint a:hover { text-decoration: underline; }

    .global-card {
      background: var(--card);
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      padding: 15px 18px 17px;
      box-shadow: var(--shadow-ink-md);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--ink);
      margin: 0 0 6px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }
    .card {
      background: var(--card);
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: var(--shadow-ink-lg);
      transition: transform 120ms ease-out, box-shadow 120ms ease-out;
    }
    .card.active-card {
      background: #fffef7;
      box-shadow: 6px 6px 0 var(--blue);
    }
    .card h3 {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 900;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 2px dashed rgba(24, 24, 27, 0.2);
    }
    .card-badges { display: inline-flex; align-items: center; gap: 6px; }
    .card label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 800;
      color: var(--ink-soft);
      margin: 11px 0 5px;
    }
    .card label a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 800;
      background: var(--blue-soft);
      border: 1.5px solid var(--ink);
      border-radius: 6px;
      padding: 1px 7px;
      font-size: 11px;
    }
    .card label a:hover { background: var(--yellow-soft); }

    input, select {
      width: 100%;
      border: 2px solid var(--ink);
      border-radius: 10px;
      padding: 8px 11px;
      font: 13px var(--font);
      font-weight: 600;
      color: var(--ink);
      background: var(--paper);
      outline: none;
      transition: box-shadow 120ms ease-out, background-color 120ms ease-out;
    }
    input[data-f="baseUrl"], input[data-f="model"], input[data-f="apiKey"] { font-family: var(--mono); font-size: 12.5px; }
    input:focus, select:focus {
      background: var(--card);
      box-shadow: 3px 3px 0 var(--blue);
    }

    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-wrap input { padding-right: 40px; }
    .toggle-eye {
      position: absolute;
      right: 6px;
      border: 1.5px solid transparent;
      background: transparent;
      color: var(--ink);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-eye:hover { background: var(--yellow-soft); border-color: var(--ink); }
    .toggle-eye svg { width: 17px; height: 17px; }

    .sug-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
    .sug-chip {
      border: 1.5px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      border-radius: 8px;
      padding: 4px 10px;
      font: 11.5px var(--mono);
      font-weight: 700;
      box-shadow: var(--shadow-ink-sm);
    }
    .sug-chip:hover { background: var(--yellow-soft); transform: translate(-1px, -1px); box-shadow: var(--shadow-ink); }
    .sug-chip.active { background: var(--yellow); color: var(--ink); font-weight: 800; }
    .sug-chip:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink) !important; }

    .tag {
      font-size: 11px;
      color: var(--ink);
      background: var(--yellow);
      border: 1.5px solid var(--ink);
      border-radius: 6px;
      padding: 2px 8px;
      font-weight: 800;
      box-shadow: 1.5px 1.5px 0 var(--ink);
    }
    .tag.default-tag {
      color: var(--green);
      background: var(--green-soft);
    }

    .action-bar {
      background: var(--card);
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      padding: 13px 18px;
      box-shadow: var(--shadow-ink-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btns { display: flex; gap: 10px; align-items: center; }
    .btn {
      border: 2px solid var(--ink);
      background: var(--card);
      color: var(--ink);
      border-radius: 11px;
      padding: 8px 20px;
      font-size: 13.5px;
      font-weight: 800;
      min-height: 38px;
      box-shadow: var(--shadow-ink);
    }
    .btn:hover { background: var(--yellow-soft); transform: translate(-1px, -1px); box-shadow: var(--shadow-ink-md); }
    .btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink) !important; }
    .btn.primary {
      background: var(--blue);
      color: #fff;
    }
    .btn.primary:hover { background: var(--blue-hover); }
    .btn.danger { color: #991b1b; background: var(--red-soft); }
    .btn.danger:hover { background: #fecdd3; }

    #message { font-size: 13px; font-weight: 800; color: var(--green); }
    #message:not(:empty) {
      padding: 6px 14px;
      border-radius: 10px;
      background: var(--green-soft);
      border: 2px solid var(--ink);
      box-shadow: var(--shadow-ink-sm);
    }
    #message.err { color: #991b1b; }
    #message.err:not(:empty) { background: var(--red-soft); }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="hero-head">
        <h2>Notebook AI 助手 · 设置</h2>
        <span class="privacy-badge">本地存储 · 不同步云端</span>
      </div>
      <p class="hint">每个服务商的 API Key 都只保存在本机 Chrome 的 <code>chrome.storage.local</code>，不会同步、不会写进日志，只发给对应的接口。服务商、模型和思考强度可以在侧边栏底部直接切换。</p>
    </section>

    <section class="global-card">
      <div class="field">
        <label for="active">默认服务商</label>
        <select id="active"></select>
      </div>
      <div class="field">
        <label for="temperature">温度（0–1，越低越稳定；开启思考时部分模型会忽略）</label>
        <input id="temperature" type="number" min="0" max="1" step="0.1" />
      </div>
    </section>

    <section id="cards" class="cards-grid"></section>

    <footer class="action-bar">
      <div class="btns">
        <button type="button" class="btn primary" id="save">保存</button>
        <button type="button" class="btn danger" id="clearKeys">清除所有 Key</button>
      </div>
      <div id="message" role="status" aria-live="polite"></div>
    </footer>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
